openapi: 3.0.3
info:
  title: Incident Management API
  version: 1.0.0
  description: >
    API для назначения обращений и управления жизненным циклом назначения.
    Архитектура основана на Event-Driven Saga.
    Kafka используется для межсервисного взаимодействия.

servers:
  - url: https://api.example.com/v1

paths:

  /incidents/{incident_id}/assign:
    post:
      summary: Назначение обращения бригаде
      description: >
        Инициируется диспетчером.
        После валидации публикуется событие
        IncidentAssignmentRequested → topic incident.assignments.requested

      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'

      responses:
        '201':
          description: Назначение создано, статус WAITING_CONFIRMATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'

        '401':
          description: JWT отсутствует или невалиден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: UNAUTHORIZED
                message: Authentication required

        '403':
          description: Роль пользователя не DISPATCHER или направление не совпадает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: FORBIDDEN_OPERATION
                message: Insufficient permissions

        '404':
          description: Обращение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INCIDENT_NOT_FOUND
                message: Incident not found

        '409':
          description: Бизнес-конфликт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyAssigned:
                  value:
                    code: INCIDENT_ALREADY_ASSIGNED
                    message: Incident already assigned
                crewUnavailable:
                  value:
                    code: CREW_NOT_AVAILABLE
                    message: Crew is not available
                idempotencyConflict:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: Request already in progress

        '500':
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assignments/{assignment_id}/accept:
    post:
      summary: Подтверждение назначения врачом
      description: >
        Подтверждение назначения.
        Публикация AssignmentAccepted → topic assignment.accepted

      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Назначение подтверждено, статус IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResponse'

        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: Пользователь не является членом данной бригады
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: FORBIDDEN_OPERATION
                message: Not allowed to accept this assignment

        '404':
          description: Назначение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ASSIGNMENT_NOT_FOUND
                message: Assignment not found

        '409':
          description: Конфликт состояния назначения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timeout:
                  value:
                    code: ASSIGNMENT_EXPIRED
                    message: Assignment expired
                alreadyProcessed:
                  value:
                    code: ASSIGNMENT_ALREADY_PROCESSED
                    message: Assignment already accepted or rejected
                idempotencyConflict:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: Duplicate request

        '500':
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assignments/{assignment_id}/reject:
    post:
      summary: Отказ назначения врачом
      description: >
        Отказ или обработка истечения таймера.
        Публикация AssignmentRejected → topic assignment.rejected

      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Назначение отклонено, статус REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectResponse'

        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: Нет прав на отклонение назначения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Назначение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Назначение уже обработано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ASSIGNMENT_ALREADY_PROCESSED
                message: Assignment already accepted or rejected

        '500':
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:

  schemas:

    AssignRequest:
      type: object
      required:
        - crew_id
      properties:
        crew_id:
          type: string
          format: uuid

    AssignmentResponse:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        crew_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [WAITING_CONFIRMATION]
        expires_at:
          type: string
          format: date-time

    AcceptResponse:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS]

    RejectResponse:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REJECTED]

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - FORBIDDEN_OPERATION
            - INCIDENT_NOT_FOUND
            - ASSIGNMENT_NOT_FOUND
            - INCIDENT_ALREADY_ASSIGNED
            - CREW_NOT_AVAILABLE
            - ASSIGNMENT_EXPIRED
            - ASSIGNMENT_ALREADY_PROCESSED
            - IDEMPOTENCY_CONFLICT
            - INTERNAL_ERROR
        message:
          type: string