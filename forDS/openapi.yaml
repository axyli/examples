openapi: 3.1.0
info:
  title: Incident Service API
  version: 1.0.0
  description: |
    Методы управления назначениями обращений с поддержкой Event-Driven Saga через Kafka.
    Все операции защищены Idempotency-Key и JWT.

servers:
  - url: https://api.example.com/v1

components:
  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: JWT токен пользователя
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Уникальный ключ для идемпотентных операций
      schema:
        type: string

paths:
  /incidents/{incident_id}/assign:
    post:
      summary: Назначение обращения (Saga)
      description: |
        Incident Service инициирует назначение бригады. Публикует событие `IncidentAssignmentRequested` в топик `incident.assignments.requested`.
        Crew Service подписан на топик и резервирует бригаду, публикуя `CrewReserved` или `CrewReservationFailed`.
        Incident Service завершает создание `incident_assignment`, обновляет статус обращения и публикует `IncidentAssigned` для Notification Service и фронта.
      tags:
        - Incident Service
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Идентификатор обращения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - crew_id
              properties:
                crew_id:
                  type: string
                  format: uuid
                  description: Идентификатор бригады
            example:
              crew_id: "6a7e334f-9210-4f07-b8e1-0f9b8a12c4a1"
      responses:
        '201':
          description: Назначение успешно создано
          content:
            application/json:
              schema:
                type: object
                required:
                  - assignment_id
                  - incident_id
                  - crew_id
                  - status
                  - expires_at
                properties:
                  assignment_id:
                    type: string
                    format: uuid
                  incident_id:
                    type: string
                    format: uuid
                  crew_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - WAITING_CONFIRMATION
                  expires_at:
                    type: string
                    format: date-time
              example:
                assignment_id: "b21a9f6e-7c14-4d3f-bc9c-12f32acb4e11"
                incident_id: "9f83d9b1-1b62-4c4f-8e4e-6bfc84f1d901"
                crew_id: "6a7e334f-9210-4f07-b8e1-0f9b8a12c4a1"
                status: "WAITING_CONFIRMATION"
                expires_at: "2026-03-04T12:30:00Z"
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав
        '404':
          description: Обращение или бригада не найдены
        '409':
          description: Назначение уже создано или Idempotency-Key в процессе
        '500':
          description: Внутренняя ошибка сервиса

  /assignments/{assignment_id}/accept:
    post:
      summary: Подтверждение назначения врачом
      description: |
        Врач подтверждает назначение. Проверяется таймаут (expires_at > now()).  
        Incident Service публикует `AssignmentAccepted` в топик `assignment.accepted`.  
        Crew Service подписан на топик и переводит бригаду в статус BUSY (`RESERVED → BUSY`), публикуя `CrewBusy` в `crew.status.updated`.  
        Incident Service обновляет `incident.status → IN_PROGRESS`, создает запись в audit_log и публикует уведомления.
      tags:
        - Incident Service
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Идентификатор назначения
      requestBody:
        required: false
      responses:
        '200':
          description: Назначение подтверждено
          content:
            application/json:
              schema:
                type: object
                required:
                  - assignment_id
                  - incident_id
                  - crew_id
                  - status
                properties:
                  assignment_id:
                    type: string
                    format: uuid
                  incident_id:
                    type: string
                    format: uuid
                  crew_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - ACCEPTED
              example:
                assignment_id: "b21a9f6e-7c14-4d3f-bc9c-12f32acb4e11"
                incident_id: "9f83d9b1-1b62-4c4f-8e4e-6bfc84f1d901"
                crew_id: "6a7e334f-9210-4f07-b8e1-0f9b8a12c4a1"
                status: "ACCEPTED"
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав
        '404':
          description: Назначение не найдено
        '409':
          description: Таймаут истек или параллельный отказ/повторная обработка
        '500':
          description: Внутренняя ошибка сервиса

  /assignments/{assignment_id}/reject:
    post:
      summary: Отказ назначения или таймаут
      description: |
        Врач или система отменяет назначение.  
        Incident Service публикует `AssignmentRejected` в топик `assignment.rejected`.  
        Crew Service подписан на топик и переводит бригаду в статус FREE (`RESERVED → FREE`), публикуя `CrewFreed` в `crew.status.updated`.  
        Incident Service подписан на `crew.status.updated`, обновляет `incident_assignment.status → REJECTED`, `incident.status → NEW`, создает запись в audit_log и уведомляет Notification Service.
      tags:
        - Incident Service
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Идентификатор назначения
      requestBody:
        required: false
      responses:
        '200':
          description: Назначение успешно отменено / таймаут зафиксирован
          content:
            application/json:
              schema:
                type: object
                required:
                  - assignment_id
                  - incident_id
                  - crew_id
                  - status
                properties:
                  assignment_id:
                    type: string
                    format: uuid
                  incident_id:
                    type: string
                    format: uuid
                  crew_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - REJECTED
              example:
                assignment_id: "b21a9f6e-7c14-4d3f-bc9c-12f32acb4e11"
                incident_id: "9f83d9b1-1b62-4c4f-8e4e-6bfc84f1d901"
                crew_id: "6a7e334f-9210-4f07-b8e1-0f9b8a12c4a1"
                status: "REJECTED"
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав
        '404':
          description: Назначение не найдено
        '409':
          description: Повторная обработка Idempotency-Key
        '500':
          description: Внутренняя ошибка сервиса