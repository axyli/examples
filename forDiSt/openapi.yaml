openapi: 3.0.3
info:
  title: Incident Management API
  version: 2.0.0
  description: |
    API для управления назначением обращений на бригады скорой помощи.
    
    Ключевые архитектурные решения:
    - Оркестровая Saga (Incident Service — оркестратор)
    - Идемпотентность через Idempotency-Key
    - Асинхронное взаимодействие через Kafka (Outbox pattern)
    - Оптимистичные блокировки для защиты от race conditions
    - Аудит всех действий с привязкой к пользователю и рабочему месту

servers:
  - url: https://api.example.com/v1
    description: Production server

paths:
  /incidents/{incident_id}/assign:
    post:
      summary: Назначение обращения на бригаду
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: X-Workstation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - crew_id
              properties:
                crew_id:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Назначение инициировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав
        '404':
          description: Обращение не найдено
        '409':
          description: Бизнес-конфликт
        '500':
          description: Внутренняя ошибка

  /assignments/{assignment_id}/confirm:
    post:
      summary: Подтверждение назначения врачом
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: X-Workstation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Назначение подтверждено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResponse'
        '401':
          description: Пользователь не авторизован
        '403':
          description: Нет прав на подтверждение
        '404':
          description: Назначение не найдено
        '409':
          description: Конфликт состояния
        '500':
          description: Внутренняя ошибка

components:
  schemas:
    AssignmentResponse:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
          nullable: true
        incident_id:
          type: string
          format: uuid
        crew_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING]
        message:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true

    ConfirmResponse:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CONFIRMED]
        confirmed_at:
          type: string
          format: date-time
        confirmed_by:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time